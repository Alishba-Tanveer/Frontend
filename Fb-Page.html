`<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fb Assignment</title>
    <link rel="stylesheet" href="fb.css" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  
  <body>
    <header>
      <img src="assets/pictures/logo.png" class="logo" />
      <nav class="links">
        <a href="#">Home</a>
        <a href="#">Profile</a>
        <a href="#">Find Friends</a>
        <a href="#">Account</a>
      </nav>
    </header>

    <section>
      <div class="position-relative">
        <img src="assets/pictures/image4.png" class="image" />
      </div>
      <div>
        <form>
          <button class="fb-button">Login to Facebook</button>
          <button class="t-button">Login to Twitter</button>
          <br />
          <p class="ft-1">Or</p>
          <br />
          <input type="text" placeholder="Username" class="username" />
          <br /><br />
          <input type="password" placeholder="Password" class="password" />
          <br />
          <input type="checkbox" />
          <label>Keep me Signed in</label>
          <a href="#" class="flink-1">Forgot Your Password?</a>
          <br />
          <button class="login">Login</button>
          <br />
          <p class="ft-2">Not a member ?</p>
          <a href="#" class="flink-2">Sign up Now !</a>
        </form>
        <p class="text">
          Facebook helps you connect and share with the people in<br />your
          life.
        </p>
      </div>
    </section>
    <script src="https://kit.fontawesome.com/00c63bf8d5.js" crossorigin="anonymous"></script>
  </body>
</html>
