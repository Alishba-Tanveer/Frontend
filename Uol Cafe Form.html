<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University of Lahore Café</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
        }
        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: purple;
        }
        .login-form {
            margin-top: 20px;
        }
        .login-form input {
            display: block;
            width: 80%;
            margin: 10px auto;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .login-form button {
            background: purple;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .login-form button:hover {
            background: purple;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>University of Lahore Café</h1>
        <form class="login-form">
            <input type="text" name="username" placeholder="Username" required minlength="2">
            <input type="password" name="password" placeholder="Password" required minlength="2">
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
